name: aida_vpn
description: Aida VPN - Xray based VPN client with Cloudflare free config builder.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_v2ray_client: ^3.5.0
  shared_preferences: ^2.3.2
  flutter_secure_storage: ">=9.2.2 <11.0.0"
  http: ^1.2.2
  http_parser: ^4.0.2
  cryptography: ^2.7.0
  mobile_scanner: ">=6.0.0 <8.0.0"
  image_picker: ^1.1.2
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/worker.js
    - assets/logo.png
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
        - asset: assets/fonts/Vazirmatn-ExtraBold.ttf
          weight: 800
